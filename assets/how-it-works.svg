<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-label="How it works: Claude Code hooks feed the recorder, which writes an append-only timeline and atomic checkpoints into .blackbox; on the next SessionStart the recovered state is injected back into Claude">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff8a3d"/></marker>
    <style>
      .h{font:800 26px ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#f0f6fc}
      .s{font:500 14px ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#8b949e}
      .m{font:600 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#e6edf3}
      .d{font:500 12.5px ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#8b949e}
      .k{font:700 12px ui-monospace,Consolas,Menlo,monospace;letter-spacing:2px}
    </style>
  </defs>
  <rect width="1200" height="500" rx="18" fill="#0d1117"/>
  <text x="40" y="52" class="h">How it works</text>
  <text x="40" y="80" class="s">Six Claude Code hooks → one tiny Python recorder → plain files in your project. 100% local, zero dependencies.</text>

  <!-- hooks -->
  <text x="40" y="122" class="k" fill="#79c0ff">CLAUDE CODE HOOKS</text>
  <g>
    <rect x="40" y="136" width="300" height="44" rx="10" fill="#161b22" stroke="#30363d"/><text x="58" y="163" class="m">SessionStart</text><text x="322" y="163" class="d" text-anchor="end">injects state ↺</text>
    <rect x="40" y="188" width="300" height="44" rx="10" fill="#161b22" stroke="#30363d"/><text x="58" y="215" class="m">UserPromptSubmit</text><text x="322" y="215" class="d" text-anchor="end">prompt</text>
    <rect x="40" y="240" width="300" height="44" rx="10" fill="#161b22" stroke="#30363d"/><text x="58" y="267" class="m">PreToolUse <tspan fill="#8b949e">(Bash)</tspan></text><text x="322" y="267" class="d" text-anchor="end">"started"</text>
    <rect x="40" y="292" width="300" height="44" rx="10" fill="#161b22" stroke="#30363d"/><text x="58" y="319" class="m">PostToolUse</text><text x="322" y="319" class="d" text-anchor="end">"finished" · files</text>
    <rect x="40" y="344" width="300" height="44" rx="10" fill="#161b22" stroke="#30363d"/><text x="58" y="371" class="m">PreCompact · Stop</text><text x="322" y="371" class="d" text-anchor="end">checkpoint + git</text>
  </g>

  <!-- recorder -->
  <g stroke="#8b949e" stroke-width="2" marker-end="url(#a)">
    <line x1="340" y1="210" x2="436" y2="250"/><line x1="340" y1="262" x2="436" y2="262"/><line x1="340" y1="314" x2="436" y2="276"/><line x1="340" y1="366" x2="436" y2="288"/>
  </g>
  <rect x="440" y="200" width="290" height="130" rx="18" fill="#3a1d07" stroke="#ff8a3d" stroke-width="2"/>
  <text x="585" y="236" text-anchor="middle" class="m" style="font-size:17px;fill:#ffa057">blackbox.py hook</text>
  <text x="585" y="262" text-anchor="middle" class="d" style="fill:#e6edf3">🔐 redacts secrets</text>
  <text x="585" y="284" text-anchor="middle" class="d" style="fill:#e6edf3">💾 atomic write + fsync</text>
  <text x="585" y="306" text-anchor="middle" class="d" style="fill:#e6edf3">🛟 never breaks your session</text>
  <line x1="730" y1="265" x2="806" y2="265" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>

  <!-- files -->
  <text x="810" y="122" class="k" fill="#56d364">.blackbox/  (git-ignored)</text>
  <rect x="810" y="136" width="350" height="252" rx="14" fill="#161b22" stroke="#3fb950" stroke-opacity=".6"/>
  <g>
    <text x="830" y="168" class="m">checkpoints/state.json</text><text x="830" y="186" class="d">task · next step · files · last command</text>
    <text x="830" y="216" class="m">history/events.jsonl</text><text x="830" y="234" class="d">append-only timeline</text>
    <text x="830" y="264" class="m">history/prompts.md · commands.log</text><text x="830" y="282" class="d">what you asked · what ran</text>
    <text x="830" y="312" class="m">history/decisions.md</text><text x="830" y="330" class="d">why things were decided</text>
    <text x="830" y="360" class="m">snapshots/</text><text x="830" y="378" class="d">last 50 checkpoints</text>
  </g>

  <!-- loop back -->
  <path d="M985 388 V 450 H 22 V 158 H 34" fill="none" stroke="#ff8a3d" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#ao)"/>
  <rect x="440" y="432" width="330" height="36" rx="18" fill="#0d1117" stroke="#ff8a3d"/>
  <text x="605" y="455" text-anchor="middle" class="m" style="fill:#ffa057;font-size:13px">next session: recovered state → Claude</text>
</svg>
