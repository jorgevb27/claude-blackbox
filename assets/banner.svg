<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="claude-blackbox — the flight recorder for Claude Code">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#1a1410"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#e2590f"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>

  <!-- flight recorder -->
  <g transform="translate(110 92)">
    <rect x="0" y="0" width="230" height="216" rx="22" fill="url(#box)"/>
    <rect x="0" y="0" width="230" height="216" rx="22" fill="none" stroke="#ffb27a" stroke-opacity="0.6" stroke-width="2"/>
    <g fill="none" stroke="#1a0f08" stroke-width="7" stroke-linecap="round">
      <line x1="34" y1="44" x2="196" y2="44"/>
      <line x1="34" y1="172" x2="196" y2="172"/>
    </g>
    <text x="115" y="62" fill="#1a0f08" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="2" dy="20">FLIGHT RECORDER</text>
    <polyline points="34,128 62,128 74,98 88,150 102,112 114,128 140,128 152,104 164,140 176,128 196,128"
              fill="none" stroke="#1a0f08" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="206" cy="24" r="6" fill="#33ff99"/>
  </g>

  <!-- text -->
  <text x="400" y="180" fill="#f0f6fc" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="76" font-weight="800" letter-spacing="-2">claude<tspan fill="#ff8a3d">-blackbox</tspan></text>
  <text x="404" y="232" fill="#c9d1d9" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="30">The flight recorder for Claude Code.</text>
  <text x="404" y="282" fill="#8b949e" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="21">crash → restart → <tspan fill="#ff8a3d">resume</tspan> → keep working</text>
</svg>
