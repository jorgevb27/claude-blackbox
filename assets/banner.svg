<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="claude-blackbox — the flight recorder for Claude Code. Crash, restart, resume.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset=".6" stop-color="#14100c"/><stop offset="1" stop-color="#1f1208"/></linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffa057"/><stop offset="1" stop-color="#e2590f"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ff8a3d" stop-opacity=".35"/><stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
  </defs>
  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#grid)"/>
  <circle cx="235" cy="210" r="210" fill="url(#glow)"/>

  <!-- recorder -->
  <g transform="translate(110 84)">
    <rect x="10" y="14" width="240" height="228" rx="24" fill="#000" opacity=".35"/>
    <rect width="240" height="228" rx="24" fill="url(#box)"/>
    <rect x="1" y="1" width="238" height="226" rx="23" fill="none" stroke="#ffd0ab" stroke-opacity=".55" stroke-width="2"/>
    <rect x="22" y="22" width="196" height="40" rx="8" fill="#1a0f08"/>
    <text x="120" y="48" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="800" fill="#ff8a3d" letter-spacing="3">FLIGHT RECORDER</text>
    <rect x="22" y="80" width="196" height="96" rx="10" fill="#1a0f08"/>
    <polyline points="34,128 58,128 68,104 80,152 92,112 104,128 126,128 136,98 148,156 160,118 172,128 206,128" fill="none" stroke="#3fb950" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="206" cy="128" r="5" fill="#3fb950"/>
    <g fill="#1a0f08"><circle cx="40" cy="204" r="7"/><circle cx="200" cy="204" r="7"/></g>
    <text x="120" y="210" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="12" font-weight="700" fill="#1a0f08">● REC  .blackbox/</text>
  </g>

  <text x="420" y="160" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="78" font-weight="800" fill="#f0f6fc" letter-spacing="-2.5">claude<tspan fill="#ff8a3d">-blackbox</tspan></text>
  <text x="424" y="212" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="29" fill="#e6edf3">The flight recorder for Claude Code.</text>
  <text x="424" y="250" font-family="ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" fill="#8b949e">Power cut, reboot or compaction? Claude already knows where it left off.</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700">
    <rect x="424" y="286" width="118" height="40" rx="20" fill="#3d1414" stroke="#f85149"/><text x="483" y="312" text-anchor="middle" fill="#ff7b72">⚡ crash</text>
    <text x="556" y="312" fill="#8b949e">→</text>
    <rect x="580" y="286" width="134" height="40" rx="20" fill="#161b22" stroke="#8b949e"/><text x="647" y="312" text-anchor="middle" fill="#c9d1d9">↻ restart</text>
    <text x="728" y="312" fill="#8b949e">→</text>
    <rect x="752" y="286" width="134" height="40" rx="20" fill="#3a1d07" stroke="#ff8a3d"/><text x="819" y="312" text-anchor="middle" fill="#ffa057">▶ resume</text>
    <text x="900" y="312" fill="#8b949e">→</text>
    <rect x="924" y="286" width="184" height="40" rx="20" fill="#0f2a17" stroke="#3fb950"/><text x="1016" y="312" text-anchor="middle" fill="#56d364">✔ keep working</text>
  </g>
</svg>
